<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Abhinix...</title>

  <!-- Instant Meta Refresh -->
  <meta http-equiv="refresh" content="0; url=https://abhinix.vercel.app">
  <link rel="canonical" href="https://abhinix.vercel.app">

  <!-- Immediate JavaScript Redirect -->
  <script>
    window.location.replace("https://abhinix.vercel.app");
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #00171f;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(0, 238, 238, 0.15);
      border-top-color: #00eeee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }
    a {
      color: #00eeee;
      text-decoration: none;
      font-weight: 500;
      padding: 8px 18px;
      border: 1px solid rgba(0, 238, 238, 0.4);
      border-radius: 8px;
      transition: all 0.2s;
    }
    a:hover {
      background: rgba(0, 238, 238, 0.1);
      border-color: #00eeee;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Redirecting to Abhinix</h1>
  <p>Please wait, you are being redirected to the new website...</p>
  <a href="https://abhinix.vercel.app">Click here if you are not redirected automatically</a>
</body>
</html>
